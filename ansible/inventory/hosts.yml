---
# Ansible Inventory for Infrastructure Setup
# Update IP addresses and hostnames according to your environment

all:
  vars:
    # Common proxy settings
    http_proxy: "http://cloudproxy.nat.bt.com:8080"
    https_proxy: "https://cloudproxy.nat.bt.com:8080"
    no_proxy: "127.0.0.1,localhost,::1,10.0.0.0/8,192.168.0.0/16,172.16.0.0/12"
    
    # Ansible connection settings
    ansible_ssh_user: "root"
    ansible_ssh_pass: "{{ vault_ssh_password }}"  # Use ansible-vault for security
    ansible_connection: "ssh"
    ansible_port: 22
    
    # Default become method
    ansible_become: true
    ansible_become_method: "sudo"

  children:
    
    # Kubernetes Cluster
    kubernetes:
      vars:
        k8s_version: "1.35.1"
        k8s_series: "v1.35"
        control_plane_ip: "10.2.162.64"
        control_plane_port: "61149"
        containerd_version: "1.7.18"
        runc_version: "1.1.12"
        cni_plugins_version: "1.6.2"
        pod_cidr: "10.244.0.0/16"
        
      children:
        k8s_control_plane:
          hosts:
            k8s-master-1:
              ansible_host: "10.2.162.64"
              ansible_hostname: "k8s-master-1"
              k8s_role: "cp-init"
              
        k8s_workers:
          hosts:
            k8s-worker-1:
              ansible_host: "10.2.162.65"
              ansible_hostname: "k8s-worker-1"
              k8s_role: "worker"
            k8s-worker-2:
              ansible_host: "10.2.162.66"
              ansible_hostname: "k8s-worker-2"
              k8s_role: "worker"

    # Kafka Cluster
    kafka:
      vars:
        kafka_version: "4.0.0"
        scala_version: "2.13"
        kafka_install_dir: "/opt/kafka"
        kafka_data_dir: "/data/kafka"
        kafka_user: "kafka"
        java_version: "17"
        
        # Controller quorum for Kafka cluster
        controller_quorum: "1@10.2.162.70:9093,2@10.2.162.71:9093,3@10.2.162.72:9093"
        
      hosts:
        kafka-node-1:
          ansible_host: "10.2.162.70"
          ansible_hostname: "kafka-node-1"
          node_id: 1
          node_ip: "10.2.162.70"
          
        kafka-node-2:
          ansible_host: "10.2.162.71"
          ansible_hostname: "kafka-node-2"
          node_id: 2
          node_ip: "10.2.162.71"
          
        kafka-node-3:
          ansible_host: "10.2.162.72"
          ansible_hostname: "kafka-node-3"
          node_id: 3
          node_ip: "10.2.162.72"

    # Jenkins & Maven
    ci_cd:
      vars:
        jenkins_version: "2.440.3"
        jenkins_home: "/var/lib/jenkins"
        jenkins_port: 8080
        maven_version: "3.9.9"
        maven_home: "/opt/maven"
        java_version: "17"
        
      hosts:
        jenkins-server:
          ansible_host: "10.2.162.80"
          ansible_hostname: "jenkins-server"
